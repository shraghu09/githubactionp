name : 02 ci workflows
on:
 push:
jobs:
 flask-ci-job:
   runs-on: ubuntu-latest

   steps:
     - name: checkout repository
       uses: actions/checkout@v6

     - name: login to docker hub
       uses: docker/login-action@v2
       with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}

     - name: Build and push
       uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: raghavendrahm/raghucloud:v1.0.0  

    #  - name: build a docker image
    #    run: docker build -t githubactionp-flask-app:v1.0.0 .github/workflows/Action/project-files

     - name: run container
       run: docker run -d -p 5000:5000 --name githubactionp-flask-container githubactionp-flask-app:v1.0.0  

     - name: test the flask application
       run: |
         sleep 5
         curl -f http://localhost:5000




