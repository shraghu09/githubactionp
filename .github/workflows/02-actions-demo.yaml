name: 02 ci workflows

on:
  push:
    branches:
      - main

jobs:
  flask-ci-job:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .github/workflows/Action/project-files
          push: true
          tags: raghavendrahm/raghucloud:v1.0.0

      - name: run container
        run: |
          docker run -d -p 5000:5000 --name githubactionp-flask-container raghavendrahm/raghucloud:v1.0.0

      - name: test the flask application
        run: |
          sleep 5
          curl -f http://localhost:5000